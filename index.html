<!DOCTYPE html>
<html>
<head>
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<style>

body{
  margin:0;
  font-family:Segoe UI;
  background:#f4f8f5;
}

.header{
  background:#198754;
  color:white;
  padding:30px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:32px;
}

.container{
  max-width:700px;
  margin:40px auto;
  padding:20px;
}

.card{

  background:white;
  border-radius:20px;

  padding:35px;

  margin-bottom:25px;

  box-shadow:
  0 5px 15px
  rgba(0,0,0,.1);

  text-align:center;
}

.btn{

  display:block;

  width:100%;

  padding:25px;

  font-size:24px;

  border:none;

  border-radius:15px;

  color:white;

  font-weight:bold;

  cursor:pointer;

  margin-top:20px;
}

.form{
  background:#198754;
}

.kua{
  background:#0d6efd;
}

.admin{
  background:#fd7e14;
}

@media(max-width:600px){

  .header h1{
    font-size:26px;
  }

  .card{
    padding:25px;
  }

  .btn{

    padding:22px;

    font-size:20px;

  }

}

</style>
</head>

<body>

<div class="header">

<h1>
E-CATIN UPT PUSKESMAS CIRUAS
</h1>

<p>
Sistem Informasi Calon Pengantin
</p>

</div>

<div class="container">

<div class="card">

<h2>
📝 Pendaftaran E-CATIN
</h2>

<button
class="btn form"
onclick="
location.href='?page=form'
">
BUKA PENDAFTARAN
</button>

</div>

<div class="card">

<h2>
🏢 Login KUA
</h2>

<button
class="btn kua"
onclick="
location.href='?page=kua'
">
MASUK KUA
</button>

</div>

<div class="card">

<h2>
⚙️ Login Admin
</h2>

<button
class="btn admin"
onclick="
location.href='?page=admin'
">
MASUK ADMIN
</button>

</div>

</div>

</body>
</html>
