<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial;
}

.menu{
  display:flex;
  background:#198754;
}

.menu button{
  flex:1;
  padding:18px;
  border:none;
  background:#198754;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.menu button:hover{
  background:#157347;
}

#iframeApp{
  width:100%;
  height:calc(100vh - 60px);
  border:none;
}
</style>
</head>

<body>

<div class="menu">

<button onclick="bukaForm()">
📝 PENDAFTARAN
</button>

<button onclick="bukaKUA()">
🏢 LOGIN KUA
</button>

<button onclick="bukaAdmin()">
⚙️ LOGIN ADMIN
</button>

</div>

<iframe
id="iframeApp"
src="https://script.google.com/macros/s/DEPLOY_ID_LU/exec?page=form">
</iframe>

<script>

function bukaForm(){
  document.getElementById("iframeApp").src =
  "https://script.google.com/macros/s/DEPLOY_ID_LU/exec?page=form";
}

function bukaKUA(){
  document.getElementById("iframeApp").src =
  "https://script.google.com/macros/s/DEPLOY_ID_LU/exec?page=kua";
}

function bukaAdmin(){
  document.getElementById("iframeApp").src =
  "https://script.google.com/macros/s/DEPLOY_ID_LU/exec?page=admin";
}

</script>

</body>
</html>
